name: Build

on:
  pull_request:
  push:
    branches: [main]

# Läuft ein neuer Commit auf denselben PR, wird der alte Lauf abgebrochen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug-APK bauen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Die sherpa-onnx-AAR ist eine Datei-Dependency und muss vorliegen,
      # sonst schlägt schon die Konfiguration fehl. Die großen Sprachmodelle
      # (~400 MB) braucht der Compiler nicht – die bleiben draußen.
      - name: sherpa-onnx-AAR cachen
        uses: actions/cache@v6
        with:
          path: app/libs
          key: sherpa-aar-1.13.3

      - name: AAR laden (ohne Sprachmodelle)
        run: ./scripts/download-models.sh --libs-only

      # assembleDebug bleibt trotz Build-Flavors (ADR-034) gültig – es ist
      # ein Aggregat-Task, der beide Varianten baut (standardDebug + ngoDebug).
      - name: Bauen (standard + ngo)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Reine JVM-Tests (Parser, Intent-Erkennung) – kein Emulator nötig.
      # Beide Flavors einzeln, damit ein Bruch der Flavor-Trennung (z.B.
      # versehentlich ein Anthropic-Import in geteiltem Code) sofort auffällt.
      - name: Unit-Tests (standard + ngo)
        run: ./gradlew testStandardDebugUnitTest testNgoDebugUnitTest --no-daemon

      - name: Testbericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-bericht
          path: app/build/reports/tests/test*DebugUnitTest/
          if-no-files-found: ignore

      - name: Android-Lint (standard + ngo)
        run: ./gradlew lintStandardDebug lintNgoDebug --no-daemon
        continue-on-error: true

      - name: Lint-Bericht sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-bericht
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
